name: Maven CI

on:
  pull_request:
    branches:
      - sandbox
      - main
  push:
    branches:
      - sandbox
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Maven WAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package